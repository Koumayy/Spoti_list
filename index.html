<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Mise en forme de données musicales issues de Spotify.">
  <title>Les musiques du Marill</title>

  <!-- Bootstrap 5 -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous">

  <link rel="stylesheet" href="style/style.css">
</head>
<body>

  <!-- En-tête -->
  <header class="app-header text-center text-white py-5">
    <div class="container">
      <h1 class="fw-bold display-4 mb-2">les musiques du Marill</h1>
      <p class="lead mb-0">je n'ai pas d'inspi pour le sous-titre, de toute façon vous savez ce qui va y avoir</p>
    </div>
  </header>

  <main class="container my-4">

    <!-- Graphiques -->
    <section class="row g-4 mb-4" aria-label="Graphiques statistiques">
      <div class="col-12 col-lg-6">
        <div class="card shadow-sm h-100">
          <div class="card-header card-header-blue text-white fw-semibold">
            Top 10 des Artistes
          </div>
          <div class="card-body">
            <canvas id="artists-chart" role="img"
                    aria-label="Graphique en barres du top 10 des artistes par nombre de morceaux"></canvas>
          </div>
        </div>
      </div>

      <div class="col-12 col-lg-6">
        <div class="card shadow-sm h-100">
          <div class="card-header card-header-green text-white fw-semibold">
            Distribution des Genres
          </div>
          <div class="card-body">
            <canvas id="genres-chart" role="img"
                    aria-label="Graphique circulaire de la distribution des genres musicaux"></canvas>
          </div>
        </div>
      </div>
    </section>

    <!-- Liste des morceaux -->
    <section aria-label="Liste des morceaux">
      <div class="card shadow-sm">
        <div class="card-header card-header-blue text-white d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-2">
          <span class="fw-semibold">Liste des Morceaux</span>
          <div class="search-box">
            <label for="search" class="visually-hidden">Rechercher un morceau</label>
            <input type="search" id="search" class="form-control form-control-sm"
                   placeholder="Rechercher…" autocomplete="off">
          </div>
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead>
                <tr>
                  <th scope="col">Titre</th>
                  <th scope="col">Artiste</th>
                  <th scope="col">Album</th>
                  <th scope="col" class="text-end">Action</th>
                </tr>
              </thead>
              <tbody id="tracks-body">
                <!-- Les lignes seront générées dynamiquement -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- Modal des détails d'un morceau -->
  <div class="modal fade" id="track-modal" tabindex="-1" aria-labelledby="track-modal-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header card-header-blue text-white">
          <h2 class="modal-title h5" id="track-modal-title">Détails du morceau</h2>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fermer"></button>
        </div>
        <div class="modal-body">
          <div class="text-center mb-3">
            <img id="modal-cover" src="" alt="" class="img-fluid rounded modal-cover">
          </div>
          <dl class="row mb-0">
            <dt class="col-4">Titre</dt><dd class="col-8" id="modal-title-value"></dd>
            <dt class="col-4">Artiste(s)</dt><dd class="col-8" id="modal-artists"></dd>
            <dt class="col-4">Album</dt><dd class="col-8" id="modal-album"></dd>
            <dt class="col-4">Genre(s)</dt><dd class="col-8" id="modal-genres"></dd>
            <dt class="col-4">Durée</dt><dd class="col-8" id="modal-duration"></dd>
            <dt class="col-4">Sortie</dt><dd class="col-8" id="modal-release"></dd>
            <dt class="col-4">Popularité</dt><dd class="col-8" id="modal-popularity"></dd>
          </dl>
          <div id="modal-preview-wrapper" class="mt-3 d-none">
            <p class="mb-1 fw-semibold">Extrait audio</p>
            <audio id="modal-preview" controls class="w-100">
              Votre navigateur ne gère pas la lecture audio.
            </audio>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Template d'une ligne de morceau (élément répétitif) -->
  <template id="track-row-template">
    <tr>
      <th scope="row" class="track-title fw-normal"></th>
      <td class="track-artist"></td>
      <td class="track-album"></td>
      <td class="text-end">
        <button type="button" class="btn btn-sm btn-primary btn-details">
          <span aria-hidden="true">ℹ</span> Détails
        </button>
      </td>
    </tr>
  </template>

  <!-- Bootstrap JS -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

  <script src="script/script.js"></script>
</body>
</html>
